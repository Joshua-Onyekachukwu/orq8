# ORQ8 gitleaks config — automated secret scanning (risk R-006).
#
# Scans full history + worktree on every push/PR (see
# .github/workflows/secret-scan.yml). The allowlist below covers ONLY
# synthetic fixtures used by the test suite and docs: every entry is shaped
# so a REAL key cannot match it (fixed `test`/`dev`/`embed-secret` markers,
# redaction runs of `x`). A production-shaped key anywhere — including inside
# a test file — still fails the build.

[allowlist]
description = "synthetic fixtures and redacted placeholders, never live credentials"
regexTarget = "match"
regexes = [
  '''sk-(or-)?test-[A-Za-z0-9_-]+''',
  '''sk-embed-secret''',
  '''sk-orq8-dev-[A-Za-z0-9_-]+''',
  '''nvapi-test-key''',
  '''ghp_x+''',
  '''attacker@evil\.test''',
  '''pilot@orq8\.test''',
]
paths = [
  '''\.gitleaks\.toml''',
]
