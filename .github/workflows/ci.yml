name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: cd apps/api && npx tsc --noEmit

      - name: Typecheck Web
        run: cd apps/web && npx tsc --noEmit

  lineage:
    name: Schema lineage parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The drift detector, finally able to run with no database to point at:
      # it boots an embedded Postgres, applies BOTH lineages from scratch and
      # diffs the catalog against the committed baseline. That is a check this
      # repository did not have, and its absence is why a migration contradicting
      # the other lineage (0048 tightening agent_jobs.locked_at) shipped with
      # typecheck, tests and parity all green: every existing parity mode needed
      # a live database, so it could only ever be run by hand, by someone with
      # credentials, on a good day.
      #
      # Verified both ways locally: clean on the current tree (exit 0), and exit 1
      # naming `agent_jobs.locked_at` when a probe migration re-tightened it.
      - name: Fresh lineage matches the committed baseline
        run: pnpm exec tsx scripts/lineage-parity.ts --check

  # The scheduled workflows (`orq8-jobs`, `waitlist-drip`, `nightly-rehearsal`)
  # all depend on one thing this repository never checked: that the `API_URL`
  # secret still points at a live ORQ8 API. When that host was deleted they went
  # red for days across six workflows, each failure reading like its own product
  # bug — which is exactly what a stale secret looks like from the outside.
  #
  # `scripts/jobs-canary.mjs` answers that one question and names the secret to
  # fix. Its three verdicts are 0 pass, 1 configured-but-broken, 2 not armed:
  #   exit 1  fails this job — a deleted host, a wrong app (it reads the API's
  #           `service` id, so the web app's `/healthz` cannot pass for it) or a
  #           refused token is a real outage of every scheduled job.
  #   exit 2  a visible notice, not a failure: a fork pull request never
  #           receives repository secrets, so its author cannot fix this and
  #           should not be failed for it. The scheduled workflows treat the
  #           same verdict as a failure, because there the secret *is* theirs.
  # Dependency-free (plain node, no install) so the check cannot be skipped
  # because a package failed to resolve.
  jobs-canary:
    name: Scheduled jobs canary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is API_URL still the live API?
        env:
          API_URL: ${{ secrets.API_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
        run: |
          node scripts/jobs-canary.mjs
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::Scheduled-jobs canary not armed here: repository secrets are not exposed to this run (expected on fork pull requests). The scheduled workflows gate on it, so a stale API_URL still fails there."
            exit 0
          fi
          exit $code

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orq8
          POSTGRES_PASSWORD: orq8_dev_only_change_me
          POSTGRES_DB: orq8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orq8"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://orq8:orq8_dev_only_change_me@localhost:5432/orq8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate test database — drizzle base lineage (app auth/sessions tables)
        run: pnpm --filter @orq8/db migrate

      - name: Reconcile with supabase schema lineage (same layering as production)
        run: pnpm --filter @orq8/db migrate:supabase

      - name: Run tests
        run: pnpm -r test

  build:
    name: Build validation
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: cd apps/api && npx tsc --noEmit

      - name: Build Web (typecheck only — full Next.js build is slow)
        run: cd apps/web && npx tsc --noEmit

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ severity)
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Check for known vulnerabilities
        run: |
          echo "Running npm audit..."
          pnpm audit --audit-level=critical || echo "::warning::Critical vulnerabilities found — review before merge"

      - name: Check for secrets in code
        run: |
          # Scan for accidentally committed secrets
          if grep -r "sk-\|sk_live\|sk_test\|STRIPE_SECRET\|SUPABASE_SERVICE" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.env*" . 2>/dev/null | grep -v node_modules | grep -v ".env.example" | grep -v "config.ts" | grep -v "validation"; then
            echo "::warning::Potential secrets found in code — review before merge"
          else
            echo "No obvious secrets found in tracked files"
          fi

  audits:
    name: UI audits (contrast, RSC boundary, routes, theme)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The founder-loop design audits were advisory in local runs and silent in
      # CI — which is how a regression ships. They are dependency-light and
      # fast, so they run as one blocking job: a red audit blocks merge, the
      # same way a red typecheck does.
      - name: Contrast audit
        run: pnpm run audit:contrast

      - name: RSC boundary scan
        run: node scripts/scan-rsc-boundary.mjs

      # The route sweep and the theme walk used to run here and could never
      # pass: both drive a real browser and a running app, and this job installs
      # no browser and boots no stack. They failed for that reason on every run
      # — and the sweep's default base is *production*, which has no demo
      # account to log in with, so even with a browser it would have reported
      # 37 route failures that said nothing about this commit. They are now
      # proofs (`routes-375`, `themes`) in the `founder-loop` job, which already
      # builds the web app and boots the review stack for `routes` and `gate`.

  brand:
    name: Brand surface audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dependency-free, so no install step: the audit itself must never be
      # skipped because a package failed to resolve. It fails on a raster logo
      # asset, a hardcoded logo path, a foreign name in a rendered wordmark, or
      # a wordmark surface that draws its own lockup instead of importing
      # components/branding/logo-mark. `node scripts/brand-audit.mjs --self-test`
      # proves the rules fire.
      - name: Audit brand surfaces
        run: node scripts/brand-audit.mjs

  proofs:
    name: Proof gate (engine, auth, tenant isolation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The harnesses boot their own Postgres from the embedded binaries, so this
      # job needs no service container. Each proof prints the MVP requirements it
      # protects, and a failure names the requirement it broke, so a red job says
      # what regressed rather than just which script exited 1.
      #
      #   vertical-slice  engine: EA, execution, credits, audit, realtime
      #   auth            registration, verification, login, lockout, recovery
      #   rls             cross-tenant isolation and the policy matrix
      - name: Engine, auth and tenant-isolation proofs
        run: node scripts/proofs.mjs

  founder-loop:
    name: Founder loop on a live stack
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the web app the review stack serves
        run: pnpm --filter @orq8/web build

      # Boots the API in-process and the built web app once, then runs the two
      # proofs that need a live stack against that same boot:
      #   routes  every /app route renders real content (MVP-007, MVP-026)
      #   gate    the release gate blocks an unactivated deployment and clears an
      #           activated one (MVP-021, MVP-034) — the same script that gates
      #           a real release, proven to fail and to pass
      #
      # Blocking: it held green across the hardening cycles (docs/82), and an
      # advisory founder-loop is a founder-loop nobody reads.
      # Browsers for the sweeps. `scripts/` owns its own package.json (playwright,
      # pg), so it installs there — the same command the nightly rehearsal uses.
      - name: Install Playwright
        run: |
          cd scripts
          npm install --no-fund --no-audit
          npx playwright install --with-deps chromium

      - name: Route sweeps, theme walk, release gate and jobs canary on the review stack
        continue-on-error: false
        run: node scripts/proofs.mjs --only routes,routes-375,themes,gate,canary --with-stack

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t orq8-api:test .
