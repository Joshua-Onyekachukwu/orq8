name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck API
        run: cd apps/api && npx tsc --noEmit

      - name: Typecheck Web
        run: cd apps/web && npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: orq8
          POSTGRES_PASSWORD: orq8_dev_only_change_me
          POSTGRES_DB: orq8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orq8"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://orq8:orq8_dev_only_change_me@localhost:5432/orq8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate test database — drizzle base lineage (app auth/sessions tables)
        run: pnpm --filter @orq8/db migrate

      - name: Reconcile with supabase schema lineage (same layering as production)
        run: pnpm --filter @orq8/db migrate:supabase

      - name: Run tests
        run: pnpm -r test

  build:
    name: Build validation
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: cd apps/api && npx tsc --noEmit

      - name: Build Web (typecheck only — full Next.js build is slow)
        run: cd apps/web && npx tsc --noEmit

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (high+ severity)
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Check for known vulnerabilities
        run: |
          echo "Running npm audit..."
          pnpm audit --audit-level=critical || echo "::warning::Critical vulnerabilities found — review before merge"

      - name: Check for secrets in code
        run: |
          # Scan for accidentally committed secrets
          if grep -r "sk-\|sk_live\|sk_test\|STRIPE_SECRET\|SUPABASE_SERVICE" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.env*" . 2>/dev/null | grep -v node_modules | grep -v ".env.example" | grep -v "config.ts" | grep -v "validation"; then
            echo "::warning::Potential secrets found in code — review before merge"
          else
            echo "No obvious secrets found in tracked files"
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t orq8-api:test .
