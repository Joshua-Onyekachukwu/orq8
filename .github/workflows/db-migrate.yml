name: DB Migrate

# Migrations + seed run against the Railway Postgres (public TCP proxy) on every
# main push touching packages/db; also triggerable manually via workflow_dispatch.
on:
  push:
    branches: [main]
    paths: ["packages/db/**", "supabase/migrations/**", ".github/workflows/db-migrate.yml"]
  workflow_dispatch: {}

jobs:
  migrate:
    name: Apply migrations + seed
    runs-on: ubuntu-latest
    env:
      # Railway Postgres public TCP proxy URL (Settings → Networking → TCP Proxy)
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The supabase lineage runner is idempotent — it skips the auth shim when
      # auth.uid() already exists, and scoped drops make re-runs safe.
      - name: Migrate
        run: pnpm --filter @orq8/db migrate:supabase

      - name: Seed (idempotent — provider catalog only)
        run: pnpm --filter @orq8/db seed
