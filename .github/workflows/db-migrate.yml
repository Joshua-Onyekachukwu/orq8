name: DB Migrate

# Migrations + seed run against the Supabase Postgres on every main push
# touching packages/db; also triggerable manually via workflow_dispatch.
#
# The URL is the Supabase pooler (session mode, port 5432): the direct
# db.<ref>.supabase.co host resolves over IPv6 only, which GitHub runners do not
# have. Setup and the exact connection string shape: docs/64_SUPABASE_SETUP.md.
on:
  push:
    branches: [main]
    paths: ["packages/db/**", "supabase/migrations/**", ".github/workflows/db-migrate.yml"]
  workflow_dispatch: {}

jobs:
  migrate:
    name: Apply migrations + seed
    runs-on: ubuntu-latest
    env:
      # Supabase pooler URL, session mode (Supabase → Connect → Session pooler).
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The supabase lineage runner is idempotent — it skips the auth shim when
      # auth.uid() already exists, and scoped drops make re-runs safe. It also
      # records what it applied in supabase_migrations.schema_migrations, so a
      # later run reads the ledger instead of replaying all 34 files, and
      # `migrate:supabase:status` can be run by hand to see what a database has.
      - name: Migrate
        run: |
          pnpm --filter @orq8/db migrate:supabase:status
          pnpm --filter @orq8/db migrate:supabase

      - name: Seed (idempotent — provider catalog + demo-org plan)
        env:
          DEMO_ORG_EMAIL: demo@orq8.test
        run: |
          pnpm --filter @orq8/db seed
          pnpm --filter @orq8/db seed:demo
