name: Deploy to Vercel

# Unified Vercel deployment for ORQ8 web app (dashboard + landing page).
# Production domain orq8.vercel.app belongs to project "orq8"
# (prj_apiN6ei5QfGK4Dev4toYXLrjDmVl, per apps/web/.vercel/project.json).
# A previous version of this workflow POSTed name="orq8-web" alongside that
# project id — the name field won, the deployment landed on the parallel
# project that serves no domain, and production silently froze at an old
# commit while this workflow stayed green.
# The web app serves both the landing page (/) and the dashboard (/app).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/vercel-deploy.yml"
  schedule:
    # Every 2 hours as fallback for Hobby plan quota exhaustion
    - cron: "47 */2 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Must be the project that OWNS the production domain (orq8.vercel.app).
          # A previous id (orq8-web) deployed a parallel project that serves no
          # domain — production silently froze at an old commit while this
          # workflow stayed green. Project ids are not secrets (they are in the
          # tracked apps/web/.vercel/project.json), so it is pinned here.
          PROJECT_ID: prj_apiN6ei5QfGK4Dev4toYXLrjDmVl
          SHA: ${{ github.sha }}
        run: |
          set -u
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::PROJECT_ID not set"
            exit 1
          fi
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments" \
            -d "{\"project\":\"$PROJECT_ID\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"org\":\"Joshua-Onyekachukwu\",\"repo\":\"orq8\",\"ref\":\"main\",\"sha\":\"$SHA\"}}")
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY" | head -c 600
          echo
          if [ "$CODE" = "200" ]; then
            DEPLOY_ID=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
            if [ -z "$DEPLOY_ID" ]; then
              echo "::error::Deployment created but no id in response"
              exit 1
            fi
            echo "Deployment created: $DEPLOY_ID"
            echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          else
            if echo "$BODY" | grep -q "api-deployments-free-per-day"; then
              echo "Hobby daily deployment quota still exhausted - will retry on next schedule."
              exit 0
            fi
            echo "::error::Deployment failed with HTTP $CODE ($(echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); e=d.get('error') or {}; print(e.get('code') or e.get('message') or 'unknown')" 2>/dev/null || echo unparsed))"
            exit 1
          fi
        id: create-deployment

      - name: Production smoke check (guards against silent staleness)
        if: steps.create-deployment.outputs.deploy_id != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -u
          DEPLOY_ID="${{ steps.create-deployment.outputs.deploy_id }}"
          # Wait for the deployment itself to become READY (build failures and
          # cancels surface here instead of being mistaken for success).
          state=""
          for i in $(seq 1 40); do
            sleep 15
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOY_ID")
            state=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('readyState') or d.get('status',''))")
            echo "attempt $i: readyState=$state"
            case "$state" in
              READY) break ;;
              ERROR|CANCELED)
                echo "::error::Deployment $state — check the Vercel project build logs."
                exit 1 ;;
            esac
          done
          if [ "$state" != "READY" ]; then
            echo "::error::Deployment never became READY within 10 minutes (last state: $state)."
            exit 1
          fi
          # The domain must now serve the new build. hero-bg.png is tracked and
          # was one of the asset class silently 404-ing on the stale deploy.
          ok=0
          for i in $(seq 1 12); do
            sleep 10
            ASSET=$(curl -s -o /dev/null -w '%{http_code}' "https://orq8.vercel.app/images/hero-bg.png")
            HOMEPAGE=$(curl -s -o /dev/null -w '%{http_code}' "https://orq8.vercel.app/")
            echo "attempt $i: /=$HOMEPAGE /images/hero-bg.png=$ASSET"
            if [ "$ASSET" = "200" ] && [ "$HOMEPAGE" = "200" ]; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Deployment is READY but the production domain did not pick it up (asset/homepage check failed). Verify the project's domain aliasing."
            exit 1
          fi
          echo "Production is current (deployment READY + domain verified)."