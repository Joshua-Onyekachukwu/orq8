name: Verify Vercel Production

# ORQ8 production deploys natively: GitHub main -> Vercel Git integration
# (project "orq8", prj_apiN6ei5QfGK4Dev4toYXLrjDmVl, per
# apps/web/.vercel/project.json) -> orq8.vercel.app. The Git integration was
# connected 2026-09-10 and is the canonical pipeline; it aliased the domain to
# current main within minutes of connect.
#
# This workflow no longer CREATES deployments. The previous version POSTed to
# /v13/deployments on every push: on Hobby plan it raced the native build for
# the same commit (duplicate deployments + quota burn) and a duplicate errored
# after 30s while CI showed red for a production that was already fine.
#
# It now VERIFIES the loop instead:
#   1. the latest production deployment on the project is READY
#   2. that deployment was built from the sha this workflow ran on
#   3. the production domain serves that same build (homepage marker + asset)
# with a bounded wait for in-flight native builds. Schedule keeps a staleness
# watchdog; workflow_dispatch allows manual verification.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/vercel-deploy.yml"
  schedule:
    # Staleness watchdog (native builds make this a verification, not a fallback)
    - cron: "47 */2 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production serves this commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_apiN6ei5QfGK4Dev4toYXLrjDmVl
          SHA: ${{ github.sha }}
        run: |
          set -u
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set"
            exit 1
          fi

          # Invariant: the latest production deployment must be READY and the
          # domain must serve it. If this push did not touch the web app, the
          # latest deployment is legitimately an older web-affecting commit —
          # that is reported, not failed (this workflow covers the web project
          # only; the API still has no host — see docs/68 MVP-001).
          state=""; meta_sha=""; built_for_this_push="no"; empty=0; http_code=""; first_body=""
          for i in $(seq 1 40); do
            RESP=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=3")
            http_code=$(echo "$RESP" | tail -1)
            RESP_BODY=$(echo "$RESP" | sed '$d')
            [ -z "$first_body" ] && first_body=$(echo "$RESP_BODY" | head -c 160)
            # v6 list entries carry the deployment id as 'uid' (not 'id') —
            # reading 'id' here made the verifier see no deployments forever.
            DEPLOY_ID=$(echo "$RESP_BODY" | python3 -c "import json,sys; ds=json.load(sys.stdin).get('deployments',[]); print((ds[0].get('uid') or ds[0].get('id') or '') if ds else '')" 2>/dev/null || true)
            if [ -z "$DEPLOY_ID" ]; then
              empty=$((empty+1))
              if [ "$empty" -ge 3 ]; then
                echo "::error::Vercel API gave no deployments 3x in a row (http=$http_code, body: $first_body). If http=401 the VERCEL_TOKEN secret is wrong; if 200 with empty list the token lacks this team/project. Update the secret (Settings → Secrets and variables → Actions), then re-run."
                exit 1
              fi
            else
              empty=0
            fi
            META=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOY_ID")
            read -r state meta_sha <<< "$(echo "$META" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('readyState',''), d.get('meta',{}).get('githubCommitSha',''))" 2>/dev/null || true)"
            echo "attempt $i: latest production deployment=$DEPLOY_ID state=$state sha=$meta_sha"
            if [ "$meta_sha" = "$SHA" ]; then built_for_this_push="yes"; fi
            case "$state" in
              READY) break ;;
              ERROR|CANCELED)
                echo "::error::Native deployment $state — check the Vercel project build logs."
                exit 1 ;;
            esac
            sleep 15
          done
          if [ "$state" != "READY" ]; then
            echo "::error::Latest production deployment never reached READY (last: state=$state). Check the Vercel dashboard build logs."
            exit 1
          fi
          if [ "$built_for_this_push" = "no" ]; then
            echo "No web build for this push (no web-affecting changes). Production remains at sha $meta_sha, which is READY."
          else
            echo "This push was built and is READY (sha $meta_sha)."
          fi

          # The domain must serve the same build. The HTML build marker is a
          # stable build fingerprint; hero-bg.png / icons/quote.svg guard the
          # png and svg asset classes (a previous .vercelignore stripped
          # *.png/*.svg from deployments and CI could not catch it because
          # only the homepage was asserted — asset 404s are fatal now).
          ok=0
          for i in $(seq 1 12); do
            sleep 10
            MARK=$(curl -s "https://orq8.vercel.app/?v=$RANDOM$RANDOM" | grep -o '<!--[A-Za-z0-9_-]\{10,\}-->' | head -1 || true)
            HOMEPAGE=$(curl -s -o /dev/null -w '%{http_code}' "https://orq8.vercel.app/")
            PNG=$(curl -s -o /dev/null -w '%{http_code}' "https://orq8.vercel.app/images/hero-bg.png")
            SVG=$(curl -s -o /dev/null -w '%{http_code}' "https://orq8.vercel.app/images/icons/quote.svg")
            echo "attempt $i: /=$HOMEPAGE hero-bg.png=$PNG quote.svg=$SVG marker=$MARK"
            if [ "$HOMEPAGE" = "200" ] && [ "$PNG" = "200" ] && [ "$SVG" = "200" ]; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Production domain orq8.vercel.app does not serve the deployment (homepage=$HOMEPAGE hero-bg.png=$PNG quote.svg=$SVG). Check domain aliasing AND .vercelignore — ignoring *.png/*.svg strips public assets and 404s the logo."
            exit 1
          fi
          echo "Production is current: deployment for $SHA is READY, domain serves it, png/svg assets resolve."

      # Is production SWITCHED ON? A web app that serves and an API that boots
      # say nothing about whether the product can send a confirmation email or
      # reach a model. `scripts/release-gate.mjs` asks the running deployment
      # that question through /readyz and /v1/readiness and fails the release on
      # a production-critical capability that is not activated (docs/69).
      #
      # It then goes one step further: it fires the deployment's own mail check
      # (`POST /v1/readiness/mail-check`) and sends one real message, because
      # "SMTP_HOST is set" and "the provider accepted a message" are different
      # claims. Set the optional MAIL_PROBE_TO secret to aim the probe at a
      # mailbox you read; without it the probe goes to the address in the
      # deployment's EMAIL_FROM.
      #
      # Blocking as soon as there is something to ask. The API still has no
      # production host (docs/68 MVP-001), so with PRODUCTION_API_URL unset this
      # step reports that the release was NOT proven good instead of pretending
      # it was — a green check for a check that did not run is how "verified"
      # stops meaning anything. Set the secret and it goes red for real.
      - name: Release gate — is production switched on?
        env:
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          MAIL_PROBE_TO: ${{ secrets.MAIL_PROBE_TO }}
        run: |
          if [ -z "$PRODUCTION_API_URL" ]; then
            echo "::warning::No PRODUCTION_API_URL secret, so no release has been proven good: production activation was never checked. The web deploy is verified; the product is not. Set the secret (see docs/69) and this step becomes blocking."
            {
              echo "## Release gate: NOT RUN"
              echo ""
              echo "No \`PRODUCTION_API_URL\` secret is configured, so the API was never asked whether the product is switched on."
              echo "This deploy is verified as a *web deployment*, and unproven as a *release*."
              echo ""
              echo "Set \`PRODUCTION_API_URL\` and \`INTERNAL_TOKEN\` repository secrets to make this gate blocking."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ARGS=(--api-url "$PRODUCTION_API_URL" --web-url https://orq8.vercel.app --internal-token "$INTERNAL_TOKEN")
          if [ -n "$MAIL_PROBE_TO" ]; then ARGS+=(--mail-to "$MAIL_PROBE_TO"); fi
          node scripts/release-gate.mjs "${ARGS[@]}"
