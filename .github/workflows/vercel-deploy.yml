name: Deploy to Vercel

# Unified Vercel deployment for ORQ8 web app (dashboard + landing page).
# Single Vercel project: orq8-web
# The web app serves both the landing page (/) and the dashboard (/app).

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/vercel-deploy.yml"
  schedule:
    # Every 2 hours as fallback for Hobby plan quota exhaustion
    - cron: "47 */2 * * *"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Must be the project that OWNS the production domain (orq8.vercel.app).
          # A previous id (orq8-web) deployed a parallel project that serves no
          # domain — production silently froze at an old commit while this
          # workflow stayed green. Project ids are not secrets (they are in the
          # tracked apps/web/.vercel/project.json), so it is pinned here.
          PROJECT_ID: prj_apiN6ei5QfGK4Dev4toYXLrjDmVl
          SHA: ${{ github.sha }}
        run: |
          set -u
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::PROJECT_ID not set"
            exit 1
          fi
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments" \
            -d "{\"name\":\"orq8-web\",\"project\":\"$PROJECT_ID\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":1334678316,\"ref\":\"main\",\"sha\":\"$SHA\"}}")
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY" | head -c 600
          echo
          if [ "$CODE" = "200" ]; then
            echo "Deployment created."
          else
            if echo "$BODY" | grep -q "api-deployments-free-per-day"; then
              echo "Hobby daily deployment quota still exhausted - will retry on next schedule."
              exit 0
            fi
            echo "::error::Deployment failed with HTTP $CODE"
            exit 1
          fi

      - name: Production smoke check (guards against silent staleness)
        run: |
          set -u
          # The deployment is created async; poll until the live site reflects
          # this commit. A marker string from current main + a public/ asset
          # (this class of files was silently 404-ing on the stale deploy).
          MARKER="Golden Workflow"
          ASSET="/images/hero-bg.png"
          ok=0
          for i in $(seq 1 20); do
            sleep 30
            if curl -sf "https://orq8.vercel.app/" | grep -q "$MARKER" \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' "https://orq8.vercel.app$ASSET")" = "200" ]; then
              echo "Production is current (marker + $ASSET verified)."
              ok=1
              break
            fi
            echo "attempt $i: production not yet current..."
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Production did not reflect the deployed commit within 10 minutes — deployment created but site is stale. Check the Vercel project build logs."
            exit 1
          fi
