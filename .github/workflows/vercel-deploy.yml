name: Verify Vercel Production

# ORQ8 production deploys natively: GitHub main -> Vercel Git integration
# (project "orq8", prj_apiN6ei5QfGK4Dev4toYXLrjDmVl, per
# apps/web/.vercel/project.json) -> orq8.vercel.app. The Git integration was
# connected 2026-09-10 and is the canonical pipeline; it aliased the domain to
# current main within minutes of connect.
#
# This workflow no longer CREATES deployments. The previous version POSTed to
# /v13/deployments on every push: on Hobby plan it raced the native build for
# the same commit (duplicate deployments + quota burn) and a duplicate errored
# after 30s while CI showed red for a production that was already fine.
#
# It now VERIFIES the loop instead:
#   1. the latest production deployment on the project is READY
#   2. that deployment was built from the sha this workflow ran on
#   3. the production domain serves that same build (homepage marker + asset)
# with a bounded wait for in-flight native builds. Schedule keeps a staleness
# watchdog; workflow_dispatch allows manual verification.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/vercel-deploy.yml"
  schedule:
    # Staleness watchdog (native builds make this a verification, not a fallback)
    - cron: "47 */2 * * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production serves this commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_apiN6ei5QfGK4Dev4toYXLrjDmVl
          SHA: ${{ github.sha }}
        run: |
          set -u
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set"
            exit 1
          fi

          # Invariant: the latest production deployment must be READY and the
          # domain must serve it. If this push did not touch the web app, the
          # latest deployment is legitimately an older web-affecting commit —
          # that is reported, not failed (the API deploys to Railway
          # separately; a monorepo push need not produce a new web build).
          state=""; meta_sha=""; built_for_this_push="no"
          for i in $(seq 1 40); do
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=3")
            DEPLOY_ID=$(echo "$RESP" | python3 -c "import json,sys; ds=json.load(sys.stdin).get('deployments',[]); print(ds[0]['id'] if ds else '')" 2>/dev/null || true)
            META=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$DEPLOY_ID")
            read -r state meta_sha <<< "$(echo "$META" | python3 -c "
import json,sys
d=json.load(sys.stdin)
print(d.get('readyState',''), d.get('meta',{}).get('githubCommitSha',''))" 2>/dev/null || true)"
            echo "attempt $i: latest production deployment=$DEPLOY_ID state=$state sha=$meta_sha"
            if [ "$meta_sha" = "$SHA" ]; then built_for_this_push="yes"; fi
            case "$state" in
              READY) break ;;
              ERROR|CANCELED)
                echo "::error::Native deployment $state — check the Vercel project build logs."
                exit 1 ;;
            esac
            sleep 15
          done
          if [ "$state" != "READY" ]; then
            echo "::error::Latest production deployment never reached READY (last: state=$state). Check the Vercel dashboard build logs."
            exit 1
          fi
          if [ "$built_for_this_push" = "no" ]; then
            echo "No web build for this push (no web-affecting changes). Production remains at sha $meta_sha, which is READY."
          else
            echo "This push was built and is READY (sha $meta_sha)."
          fi

          # The domain must serve the same build. The HTML build marker is a
          # stable build fingerprint; hero-bg.png guards the /images class.
          ok=0
          for i in $(seq 1 12); do
            sleep 10
            MARK=$(curl -s "https://orq8.vercel.app/?v=$RANDOM$RANDOM" | grep -o '<!--[A-Za-z0-9_-]\{10,\}-->' | head -1 || true)
            HOMEPAGE=$(curl -s -o /dev/null -w '%{http_code}' "https://orq8.vercel.app/")
            ASSET=$(curl -s -o /dev/null -w '%{http_code}' "https://orq8.vercel.app/images/hero-bg.png")
            echo "attempt $i: /=$HOMEPAGE /images/hero-bg.png=$ASSET marker=$MARK"
            if [ "$HOMEPAGE" = "200" ]; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Production domain orq8.vercel.app does not serve the deployment (homepage failed). Verify the project's domain aliasing in the Vercel dashboard."
            exit 1
          fi
          echo "Production is current: deployment for $SHA is READY and the domain serves it."
