# ORQ8 secret scanning (risk R-006).
#
# Runs gitleaks over the FULL history plus the worktree on every push and pull
# request, and weekly on the default branch (catches newly added rules and
# keys that predate a rule). A finding FAILS the build: if a real secret is
# exposed, follow docs/ORQ8_SECRET_ROTATION_PROCEDURE.md — assess scope from
# the finding metadata, do NOT paste the value anywhere, and rotate with
# founder authorization. Benign fixtures live in .gitleaks.toml with shapes a
# real key cannot match.
name: Secret scanning

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history + worktree scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
