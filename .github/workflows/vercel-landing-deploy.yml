name: Deploy landing (retry until quota frees)

# The ORQ8 Vercel account is on the Hobby (free) plan, which caps
# deployments at 100/day. When the cap is hit, Vercel rejects every
# deployment - git-triggered and API-triggered alike - with
# `payment_required / api-deployments-free-per-day` until the rolling
# 24h window resets. This workflow retries the production deploy on a
# schedule so the landing goes live automatically as soon as the quota
# frees up. It succeeds silently while the quota is still exhausted and
# only fails on real errors.

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/vercel-landing-deploy.yml"
  schedule:
    # Every 2 hours; the daily cap resets on a rolling 24h window.
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production deployment for orq8-landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_ofwMRT7psBUm2YZkXG2DK0L37ySi
          SHA: ${{ github.sha }}
        run: |
          set -u
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not set - add it in repo Settings > Secrets and variables > Actions"
            exit 1
          fi
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v13/deployments" \
            -d "{\"name\":\"orq8-landing\",\"project\":\"orq8-landing\",\"target\":\"production\",\"gitSource\":{\"type\":\"github\",\"repoId\":1334678316,\"ref\":\"main\",\"sha\":\"$SHA\"}}")
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY" | head -c 600
          echo
          if [ "$CODE" = "200" ]; then
            echo "Deployment created."
            exit 0
          fi
          if echo "$BODY" | grep -q "api-deployments-free-per-day"; then
            echo "Hobby daily deployment quota still exhausted - will retry on next schedule."
            exit 0
          fi
          echo "::error::Deployment failed with HTTP $CODE"
          exit 1
